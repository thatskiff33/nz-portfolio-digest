# Shared in-container schedule. Edit here, then restart the scheduler container.
timezone = "Pacific/Auckland"
# Empty means MAIL_OWNER from the environment. One list applies to every report.
recipients = []
# Optional private Uptime Kuma push URL. Keep it in the server copy only, never git.
# kuma_push_url = "https://monitor.example.invalid/api/push/PRIVATE_TOKEN"

[[schedules]]
name = "prices-morning"
kind = "prices"
frequency = "daily"
at = "10:30"

[[schedules]]
name = "prices-evening"
kind = "prices"
frequency = "daily"
at = "18:30"

[[schedules]]
name = "weekly"
kind = "report"
frequency = "weekly"
weekday = "sunday"
at = "20:00"
days = 7

[[schedules]]
name = "monthly"
kind = "report"
frequency = "monthly"
day = 1
at = "08:00"
period = "last_month"

# Alerts run after each scheduled price fetch, using the report recipients and MAILER.
[alerts]
enabled = true
daily_percent = "10"
portfolio_drop_percent = "5"
period_days = 7
stale_trading_days = 3
# Without this, a rule must clear before it can send again.
# cooldown_hours = 24

# Partial overrides inherit the global holding thresholds.
# [alerts.holdings."NZX:EXAMPLE"]
# daily_percent = "15"
# stale_trading_days = 5
