schema = 1

# Sekreton task sandbox: install the app with dev tools, then run the quick gates.
# Database tests skip here (no TEST_DATABASE_URL); GitHub CI runs them against Postgres.
[setup]
run = '''
if ! command -v uv >/dev/null 2>&1; then
  python3 -m venv /tmp/uv-bootstrap &&
  /tmp/uv-bootstrap/bin/pip install -q "uv==0.13.7" &&
  export PATH="/tmp/uv-bootstrap/bin:$PATH"
fi &&
uv sync --frozen --extra dev
'''

[jobs.lint]
run = ".venv/bin/ruff check . && .venv/bin/ruff format --check ."

[jobs.test]
run = ".venv/bin/pytest -q"

# Manual action, intended for an environment with Docker and the server's .env.
[deploy.dashboard]
on_merge = false
run = "scripts/deploy-dashboard.sh"

[environment]
packages = ["openssh-client"]

# Optional manual update of an already provisioned server; no deployment on merge.
[deploy.server]
secrets = ["DEPLOY_HOST", "DEPLOY_USER", "DEPLOY_CHECKOUT", "DEPLOY_SSH_KEY", "DEPLOY_KNOWN_HOSTS"]
on_merge = false
run = "scripts/deploy.sh"
