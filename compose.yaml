# Runs on your home server. Only the dashboard publishes a private host port.
# The database stays on the compose network. Secrets come from .env.

name: portfolio-digest

x-logging: &container_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # postgres:18-alpine
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    logging: *container_logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema up to date, then exits. Also used for other commands:
  #   docker compose run --rm migrate health
  migrate:
    build: .
    logging: *container_logging
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: ["migrate"]
    volumes:
      - ./schedules.toml:/app/schedules.toml:ro
      # Shared with the scheduler so Akahu and manual price fetches can remember
      # whether an operations notice was already sent today.
      - scheduler-state:/app/state
    environment: &app_environment
      HOME: /tmp
      SCHEDULER_HEARTBEAT: /tmp/scheduler-heartbeat
      DATABASE_URL: postgresql+psycopg://portfolio:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/portfolio
      AKAHU_APP_TOKEN: ${AKAHU_APP_TOKEN:-}
      AKAHU_USER_TOKEN: ${AKAHU_USER_TOKEN:-}
      AKAHU_ACCOUNT_IDS: ${AKAHU_ACCOUNT_IDS:-[]}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_LABEL: ${GMAIL_LABEL:-}
      REPORT_RECIPIENTS: ${REPORT_RECIPIENTS:-}
      REPORT_KUMA_PUSH_URL: ${REPORT_KUMA_PUSH_URL:-}
      REPORT_PRICES_KUMA_PUSH_URL: ${REPORT_PRICES_KUMA_PUSH_URL:-}
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}

      BASE_CURRENCY: ${BASE_CURRENCY:-NZD}
      TIMEZONE: ${TIMEZONE:-Pacific/Auckland}
      PRICE_SOURCE: ${PRICE_SOURCE:-yahoo}
      FX_SOURCES: ${FX_SOURCES:-yahoo,frankfurter}
      ALERT_NTFY_URL: ${ALERT_NTFY_URL:-}
      ALERT_NTFY_TOKEN: ${ALERT_NTFY_TOKEN:-}
      ALERT_PUSHOVER_TOKEN: ${ALERT_PUSHOVER_TOKEN:-}
      ALERT_PUSHOVER_USER: ${ALERT_PUSHOVER_USER:-}
      MAILER: ${MAILER:-gmail}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_OWNER: ${MAIL_OWNER:-}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME:-}
      SES_SMTP_PASSWORD: ${SES_SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # The only scheduler: both price downloads and emailed reports use schedules.toml.
  scheduler:
    build: .
    logging: *container_logging
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    command: ["scheduler"]
    environment: *app_environment
    volumes:
      - ./schedules.toml:/app/schedules.toml:ro
      - scheduler-state:/app/state
    # Fresh while the loop has run in the last 30 minutes. A price fetch can be slow.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import os,sys,time; p=os.environ.get("SCHEDULER_HEARTBEAT","/tmp/scheduler-heartbeat"); sys.exit(0 if os.path.isfile(p) and time.time()-os.path.getmtime(p)<1800 else 1)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly compressed dump of the portfolio database, pruned after BACKUP_KEEP_DAYS.
  # Take one on demand with: docker compose run --rm backup --once
  backup:
    # postgres:18-alpine
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    logging: *container_logging
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    # A small init process, so `docker compose stop backup` ends the script straight away
    # instead of waiting 10 seconds to kill it.
    init: true
    # Writes as your server user so you can copy the backups off-server.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      # The app role owns every table, so it can dump them all; the superuser password
      # stays in the db container only.
      PGUSER: portfolio
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PGDATABASE: portfolio
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Optional Uptime Kuma push URL. Pinged only after a successful dump. Never log it.
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      # Refuse to start if BACKUP_DIR is missing, rather than Docker creating it owned by
      # root, where the backup user cannot write.
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
    # Shows as unhealthy in `docker compose ps` when no dump has been written for 26 hours.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'portfolio-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    logging: *container_logging
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    entrypoint: ["python", "-m", "portfolio_digest.web.app"]
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000"
    environment:
      HOME: /tmp
      DATABASE_URL: postgresql+psycopg://portfolio:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/portfolio
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_BIND: ${DASHBOARD_BIND:-127.0.0.1}
      DASHBOARD_SECURE_COOKIE: ${DASHBOARD_SECURE_COOKIE:-false}
      TIMEZONE: ${TIMEZONE:-Pacific/Auckland}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3); raise SystemExit(0 if r.status==200 and r.read()==b"ok" else 1)'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  scheduler-state:
