name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        # postgres:18-alpine
        image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests run as the least-privilege app role, so a migration that needs superuser
      # rights fails here rather than on the server.
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:ci-app@localhost:5432/portfolio_test
      REQUIRE_TEST_DB: "1"
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Create the app's database role, as on the server
        env:
          PGHOST: localhost
          PGPASSWORD: ci
          POSTGRES_USER: postgres
          APP_DB_PASSWORD: ci-app
        run: |
          sh scripts/db-init/10-app-role.sh
          psql -U postgres -d postgres -c "CREATE DATABASE portfolio_test OWNER portfolio"
      - name: Check the lock file matches pyproject.toml
        run: uv lock --check
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev ruff check .
      - run: uv run --frozen --extra dev ruff format --check .
      - run: uv run --frozen --extra dev pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t portfolio-digest:ci .
      - run: docker run --rm portfolio-digest:ci --version
      - name: Compose file is valid
        run: POSTGRES_ADMIN_PASSWORD=x APP_DB_PASSWORD=x docker compose config --quiet
      - name: Shell scripts are valid
        run: shellcheck scripts/backup.sh scripts/db-init/*.sh
