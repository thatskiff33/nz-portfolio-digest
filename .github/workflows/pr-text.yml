name: PR text

# GitHub can build the squash commit message from the PR title and body, so they must not
# carry a personal address. Runs on edits too, without re-running the main CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-text-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Passed through the environment, never interpolated into the script.
      - name: Check PR title and body for privacy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/check-commit-emails.py --pr-text
