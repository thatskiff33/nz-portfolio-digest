# Runs on your home server. Nothing here publishes a port: the database is only reachable
# from the other services on this compose network. Secrets come from `.env` (see .env.example).

name: portfolio-digest

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema up to date, then exits. Also used for other commands:
  #   docker compose run --rm migrate health
  migrate:
    build: .
    restart: "no"
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/portfolio
    depends_on:
      db:
        condition: service_healthy

  # Nightly compressed dump of the portfolio database, pruned after BACKUP_KEEP_DAYS.
  # Take one on demand with: docker compose run --rm backup --once
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    # Writes as your server user so you can copy the backups off-server.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      # The app role owns every table, so it can dump them all; the superuser password
      # stays in the db container only.
      PGUSER: portfolio
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PGDATABASE: portfolio
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      # Refuse to start if BACKUP_DIR is missing, rather than Docker creating it owned by
      # root, where the backup user cannot write.
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
    # Shows as unhealthy in `docker compose ps` when no dump has been written for 26 hours.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'portfolio-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
