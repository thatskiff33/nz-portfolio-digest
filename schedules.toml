# Shared in-container schedule. Edit here, then restart the scheduler container.
timezone = "Pacific/Auckland"
# Set REPORT_RECIPIENTS in the server .env, never put private addresses here.
# Non-empty environment overrides this list; an empty list falls back to MAIL_OWNER.
recipients = []
# Set optional REPORT_KUMA_PUSH_URL in the server .env, never put its URL here.
# Set optional REPORT_PRICES_KUMA_PUSH_URL in the server .env for price fetches. It is
# pinged only when every instrument and rate succeeded. Use a 26-hour heartbeat.

[[schedules]]
name = "prices-morning"
kind = "prices"
frequency = "daily"
at = "10:30"

[[schedules]]
name = "prices-evening"
kind = "prices"
frequency = "daily"
at = "18:30"

[[schedules]]
name = "weekly"
kind = "report"
frequency = "weekly"
weekday = "sunday"
at = "20:00"
days = 7

[[schedules]]
name = "monthly"
kind = "report"
frequency = "monthly"
day = 1
# After the 18:30 fetch, so the previous US close and FX fix are stored.
at = "19:00"
period = "last_month"

[[schedules]]
name = "year-end"
kind = "report"
frequency = "yearly"
month = 4
day = 1
# After the 18:30 fetch, so the previous US close and FX fix are stored.
at = "19:00"
period = "tax_year"

# Alerts run after each scheduled price fetch, using the report recipients and MAILER.
[alerts]
enabled = true
daily_percent = "10"
portfolio_drop_percent = "5"
period_days = 7
stale_trading_days = 3
# Without this, a rule must clear before it can send again.
# cooldown_hours = 24

# Partial overrides inherit the global holding thresholds.
# [alerts.holdings."NZX:EXAMPLE"]
# daily_percent = "15"
# stale_trading_days = 5
