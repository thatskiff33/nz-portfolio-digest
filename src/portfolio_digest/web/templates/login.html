{% extends "base.html" %}
{% block content %}
    <p class="eyebrow">Private workspace</p>
    <h1>Sign in</h1>
    <p class="muted">Sign in to view portfolios, trades and import notes. A signed-in session lasts eight hours and ends after 30 minutes without activity.</p>
    {% if message %}
        <p role="alert">{{ message }}</p>
    {% endif %}
    <form class="panel entry-form"
          action="/login"
          method="post"
          hx-boost="false">
        <input type="hidden" name="csrf" value="{{ request.state.browser.csrf }}">
        <input type="hidden" name="next" value="{{ next }}">
        <label>
            App password<input type="password"
       name="password"
       autocomplete="current-password"
       maxlength="1024"
       required>
        </label>
        <button>Sign in</button>
    </form>
{% endblock %}
