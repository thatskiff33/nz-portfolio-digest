# Runs on your home server. Only the dashboard publishes a private host port.
# The database stays on the compose network. Secrets come from .env.

name: portfolio-digest

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: brings the schema up to date, then exits. Also used for other commands:
  #   docker compose run --rm migrate health
  migrate:
    build: .
    restart: "no"
    command: ["migrate"]
    volumes:
      - ./schedules.toml:/app/schedules.toml:ro
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://portfolio:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/portfolio
      AKAHU_APP_TOKEN: ${AKAHU_APP_TOKEN:-}
      AKAHU_USER_TOKEN: ${AKAHU_USER_TOKEN:-}
      AKAHU_ACCOUNT_IDS: ${AKAHU_ACCOUNT_IDS:-[]}
      UPTIME_KUMA_PUSH_URL: ${UPTIME_KUMA_PUSH_URL:-}

      BASE_CURRENCY: ${BASE_CURRENCY:-NZD}
      TIMEZONE: ${TIMEZONE:-Pacific/Auckland}
      PRICE_SOURCE: ${PRICE_SOURCE:-yahoo}
      FX_SOURCES: ${FX_SOURCES:-yahoo,frankfurter}
      MAILER: ${MAILER:-gmail}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_OWNER: ${MAIL_OWNER:-}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SES_SMTP_USERNAME: ${SES_SMTP_USERNAME:-}
      SES_SMTP_PASSWORD: ${SES_SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # The only scheduler: both price downloads and emailed reports use schedules.toml.
  scheduler:
    build: .
    restart: unless-stopped
    init: true
    command: ["scheduler"]
    environment: *app_environment
    volumes:
      - ./schedules.toml:/app/schedules.toml:ro
      - scheduler-state:/app/state
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly compressed dump of the portfolio database, pruned after BACKUP_KEEP_DAYS.
  # Take one on demand with: docker compose run --rm backup --once
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    # A small init process, so `docker compose stop backup` ends the script straight away
    # instead of waiting 10 seconds to kill it.
    init: true
    # Writes as your server user so you can copy the backups off-server.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      # The app role owns every table, so it can dump them all; the superuser password
      # stays in the db container only.
      PGUSER: portfolio
      PGPASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      PGDATABASE: portfolio
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      # Refuse to start if BACKUP_DIR is missing, rather than Docker creating it owned by
      # root, where the backup user cannot write.
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
    # Shows as unhealthy in `docker compose ps` when no dump has been written for 26 hours.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'portfolio-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    entrypoint: ["python", "-m", "portfolio_digest.web.app"]
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://portfolio:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/portfolio
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      DASHBOARD_BIND: ${DASHBOARD_BIND:-127.0.0.1}
      DASHBOARD_SECURE_COOKIE: ${DASHBOARD_SECURE_COOKIE:-false}
      TIMEZONE: ${TIMEZONE:-Pacific/Auckland}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  scheduler-state:
